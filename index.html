<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D12" />

    <!-- SEO_HEAD: description, canonical, hreflang, Open Graph and JSON-LD
         are written per language by scripts/prerender.js. -->

    <!-- Headline font arrives before first paint, so the hero doesn't reflow (CLS). -->
    <link rel="preload" href="/node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/unbounded/files/unbounded-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Dark is the default; apply a saved light choice before first paint.
         A visitor who picked uz/en earlier and opens "/" goes to that page. -->
    <script>
      try {
        var lang = localStorage.getItem("lang");
        if (location.pathname === "/" && (lang === "uz" || lang === "en")) {
          location.replace("/" + lang + "/" + location.hash);
        }
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="theme-color"]').content = "#F6F5F1";
        }
      } catch (e) {}
    </script>

    <title>Фарход Номонов — Full-stack разработчик</title>
  </head>
  <body>
    <noscript>Для работы сайта необходимо включить JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
